<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NEXUS | Tool Details</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<meta name="description" content="View tool details, screenshots, and launch directly from Nexus."/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #474747; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #cdf200; }
    .badge { display: inline-block; font-family: 'Geist', sans-serif; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 10px; border: 1px solid; }
    .badge-free { border-color: #cdf200; color: #cdf200; }
    .badge-freemium { border-color: #474747; color: #c5c9ac; }
    .tag-pill { display: inline-block; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 10px; border: 1px solid #474747; color: #c5c9ac; transition: all 0.2s; cursor: pointer; text-decoration: none; }
    .tag-pill:hover { border-color: #cdf200; color: #cdf200; }
    .star-rating { display: inline-flex; gap: 2px; cursor: pointer; }
    .star-rating .star { font-size: 18px; color: #333; transition: all 0.2s; user-select: none; }
    .star-rating .star.filled { color: #cdf200; text-shadow: 0 0 6px rgba(205,242,0,0.3); }
    .star-rating .star.hovered { color: #e5e2e1; }
    .btn-launch { display: inline-flex; align-items: center; gap: 8px; background: #cdf200; color: #131313; border: none; padding: 14px 32px; font-family: 'Geist', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: all 0.3s; text-decoration: none; }
    .btn-launch:hover { background: transparent; color: #cdf200; box-shadow: inset 0 0 0 1px #cdf200; }
    .btn-secondary { display: inline-flex; align-items: center; gap: 8px; background: transparent; color: #e5e2e1; border: 1px solid #474747; padding: 14px 32px; font-family: 'Geist', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; text-decoration: none; }
    .btn-secondary:hover { border-color: #cdf200; color: #cdf200; }
</style>
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "background": "#131313",
                    "surface-container-low": "#1c1b1b",
                    "surface-container-lowest": "#0e0e0e",
                    "primary": "#ffffff",
                    "primary-container": "#cdf200",
                    "secondary-container": "#474747",
                    "on-surface": "#e5e2e1",
                    "on-surface-variant": "#c5c9ac",
                    "on-primary-container": "#5a6b00"
                },
                "spacing": {
                    "gutter": "32px",
                    "container-max": "1440px"
                },
                "fontFamily": {
                    "display-lg": ["Geist", "sans-serif"],
                    "label-mono": ["Geist Mono", "monospace"],
                    "headline-lg": ["Geist", "sans-serif"],
                    "headline-md": ["Geist", "sans-serif"],
                    "button": ["Geist", "sans-serif"],
                    "body-md": ["Geist", "sans-serif"]
                },
                "fontSize": {
                    "label-mono": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "500"}],
                    "headline-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "headline-md": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "button": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400"}]
                }
            }
        }
    }
</script>
</head>
<body class="font-body-md text-body-md bg-background min-h-screen selection:bg-primary-container selection:text-on-primary-container">

<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-md border-b border-secondary-container">
<nav class="flex justify-between items-center px-gutter py-6 max-w-container-max mx-auto">
<a href="/" class="font-headline-md text-headline-md tracking-tighter text-primary no-underline">NEXUS</a>
<div class="flex items-center gap-6">
<a href="beacon.html" class="bg-primary-container text-on-primary-container font-button text-button uppercase px-6 py-2 transition-all duration-100 active:scale-95 no-underline">CATALOG</a>
</div>
</nav>
</header>

<main class="pt-[140px] min-h-screen max-w-container-max mx-auto px-gutter pb-24">
<div class="mb-8">
<div class="flex items-baseline gap-2 font-label-mono text-label-mono uppercase tracking-widest text-on-surface-variant mb-2">
<a class="hover:text-primary no-underline" href="beacon.html">Catalog</a>
<span>/</span>
<span class="text-primary" id="breadcrumb-name">Tool</span>
</div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-[1fr_400px] gap-12">
<div>
<div style="background:#0e0e0e;border:1px solid #474747;overflow:hidden;margin-bottom:32px;">
<img id="detail-screenshot" src="" alt="" style="width:100%;aspect-ratio:16/9;object-fit:cover;display:block;" onerror="this.style.display='none'">
</div>

<div class="flex items-center gap-4 mb-6">
<img id="detail-favicon" src="" alt="" style="width:32px;height:32px;">
<div>
<h1 class="font-headline-lg text-headline-lg text-primary uppercase tracking-tight" id="detail-name">Tool Name</h1>
<div class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest" id="detail-domain">domain.com</div>
</div>
</div>

<div class="flex items-center gap-4 mb-8">
<span id="detail-pricing"></span>
<div id="detail-rating" class="star-rating"></div>
<span id="detail-rating-value" class="font-label-mono text-label-mono text-on-surface-variant"></span>
</div>

<div class="mb-8">
<h2 class="font-label-mono text-label-mono uppercase text-on-surface-variant tracking-[0.2em] mb-4">Description</h2>
<p class="text-on-surface-variant leading-relaxed" id="detail-desc"></p>
</div>

<div class="mb-8">
<h2 class="font-label-mono text-label-mono uppercase text-on-surface-variant tracking-[0.2em] mb-4">Tags</h2>
<div id="detail-tags" class="flex flex-wrap gap-2"></div>
</div>
</div>

<div class="lg:sticky lg:top-[140px] lg:self-start space-y-6">
<a id="detail-launch" href="#" target="_blank" class="btn-launch w-full justify-center">Launch Tool</a>
<a id="detail-catalog" href="beacon.html" class="btn-secondary w-full justify-center">Back to Catalog</a>

<div style="background:#1c1b1b;border:1px solid #474747;padding:24px;">
<h3 class="font-label-mono text-label-mono uppercase text-on-surface-variant tracking-[0.2em] mb-4">Info</h3>
<div class="space-y-3">
<div class="flex justify-between">
<span class="font-label-mono text-label-mono uppercase text-on-surface-variant">Domain</span>
<span class="font-label-mono text-label-mono text-primary" id="info-domain"></span>
</div>
<div style="height:1px;background:#474747;"></div>
<div class="flex justify-between">
<span class="font-label-mono text-label-mono uppercase text-on-surface-variant">Pricing</span>
<span class="font-label-mono text-label-mono text-primary" id="info-pricing"></span>
</div>
<div style="height:1px;background:#474747;"></div>
<div class="flex justify-between">
<span class="font-label-mono text-label-mono uppercase text-on-surface-variant">Category</span>
<span class="font-label-mono text-label-mono text-primary" id="info-category"></span>
</div>
<div style="height:1px;background:#474747;"></div>
<div class="flex justify-between">
<span class="font-label-mono text-label-mono uppercase text-on-surface-variant">Times Opened</span>
<span class="font-label-mono text-label-mono text-primary" id="info-accessed">0</span>
</div>
</div>
</div>
</div>
</div>

<div id="not-found" style="display:none;" class="text-center py-24">
<h1 class="font-headline-lg text-headline-lg text-primary uppercase mb-4">Tool Not Found</h1>
<p class="text-on-surface-variant mb-8">The tool you're looking for isn't in our directory.</p>
<a href="beacon.html" class="btn-launch">Browse Catalog</a>
</div>
</main>

<footer class="w-full mt-auto border-t border-secondary-container bg-background/60 backdrop-blur-sm">
<div class="grid grid-cols-1 md:grid-cols-2 gap-8 px-gutter py-12 max-w-container-max mx-auto">
<div class="space-y-4">
<div class="font-headline-md text-headline-md text-primary">NEXUS</div>
<p class="font-label-mono text-label-mono uppercase tracking-widest text-on-surface-variant leading-relaxed">&copy; 2026 MESH STUDIOS. ALL RIGHTS RESERVED.</p>
</div>
<div class="flex flex-wrap gap-x-12 gap-y-4 md:justify-end items-start pt-4">
<a class="font-label-mono text-label-mono uppercase tracking-widest text-on-surface-variant hover:text-primary-container transition-opacity" href="legal.html">LEGAL</a>
<a class="font-label-mono text-label-mono uppercase tracking-widest text-on-surface-variant hover:text-primary-container transition-opacity" href="privacy.html">PRIVACY</a>
</div>
</div>
</footer>

<script src="js/data.js"></script>
<script src="js/tools.js"></script>
<script src="js/names.js"></script>
<script src="js/descriptions.js"></script>
<script>
(() => {

if (typeof FMHY_TOOLS !== 'undefined') TOOLS.push(...FMHY_TOOLS);
if (typeof TOOL_DESCRIPTIONS !== 'undefined') TOOLS.forEach(t => { if (TOOL_DESCRIPTIONS[t.domain]) t.description = TOOL_DESCRIPTIONS[t.domain]; });
try { const ct = JSON.parse(localStorage.getItem('beacon_custom_tools') || '[]'); ct.forEach(t => { if (!TOOLS.find(x => x.domain === t.domain)) TOOLS.push(t); }); } catch {}

const TAG_DISPLAY = {
  'ai':'AI','free-chat':'Free Chat','ai-api':'AI API','ai-coding':'AI Coding',
  'ai-image':'AI Image','ai-video':'AI Video','automation':'Automation',
  'streaming':'Streaming','live-tv':'Live TV','anime':'Anime','music':'Music',
  'radio':'Radio','gaming':'Gaming','game-tools':'Game Tools','books':'Books',
  'design':'Design','image-editing':'Image Editing','video-editing':'Video Editing',
  'fonts':'Fonts','icons':'Icons','3d':'3D','templates':'Templates',
  'ui-libraries':'UI Libraries','animation':'Animation','dev-tools':'Dev Tools',
  'hosting':'Hosting','web-building':'Web Building','education':'Education',
  'science':'Science','note-taking':'Note Taking','office':'Office',
  'browsers':'Browsers','search':'Search','social':'Social','privacy':'Privacy',
  'network':'Network','system':'System','files':'Files','downloads':'Downloads',
  'torrents':'Torrents','mobile':'Mobile','linux':'Linux','no-signup':'No Signup','nsfw':'NSFW'
};
function tTag(tag) { return TAG_DISPLAY[tag] || tag; }

function toolName(domain) {
  try { const o = JSON.parse(localStorage.getItem('beacon_name_overrides') || '{}'); if (o[domain]) return o[domain]; } catch {}
  return (typeof TOOL_NAMES !== 'undefined' && TOOL_NAMES[domain]) ? TOOL_NAMES[domain] : domain;
}

function getUserRating(domain) {
  try { return parseFloat(localStorage.getItem('beacon_rating_' + domain) || '0'); } catch { return 0; }
}
function setUserRating(domain, rating) {
  localStorage.setItem('beacon_rating_' + domain, rating);
  renderRating(domain);
}
function getTimesAccessed(domain) {
  try { return parseInt(localStorage.getItem('beacon_access_' + domain) || '0', 10); } catch { return 0; }
}

function renderRating(domain) {
  const container = document.getElementById('detail-rating');
  const rating = getUserRating(domain);
  let html = '';
  for (let i = 1; i <= 5; i++) {
    html += '<span class="star ' + (i <= rating ? 'filled' : '') + '" data-value="' + i + '">&#9733;</span>';
  }
  container.innerHTML = html;
  document.getElementById('detail-rating-value').textContent = rating > 0 ? rating.toFixed(1) : '';

  container.querySelectorAll('.star').forEach(star => {
    star.addEventListener('mouseenter', () => {
      const val = parseInt(star.dataset.value);
      container.querySelectorAll('.star').forEach(s => s.classList.toggle('hovered', parseInt(s.dataset.value) <= val));
    });
    star.addEventListener('mouseleave', () => container.querySelectorAll('.star').forEach(s => s.classList.remove('hovered')));
    star.addEventListener('click', () => setUserRating(domain, parseInt(star.dataset.value)));
  });
}

const params = new URLSearchParams(window.location.search);
const domainParam = params.get('domain');

if (!domainParam) {
  document.querySelector('main > .grid').style.display = 'none';
  document.querySelector('main > .mb-8').style.display = 'none';
  document.getElementById('not-found').style.display = 'block';
} else {
  const tool = TOOLS.find(t => t.domain === domainParam);
  if (!tool) {
    document.querySelector('main > .grid').style.display = 'none';
    document.querySelector('main > .mb-8').style.display = 'none';
    document.getElementById('not-found').style.display = 'block';
  } else {
    const name = toolName(tool.domain);
    document.title = 'NEXUS | ' + name;
    document.getElementById('breadcrumb-name').textContent = name;
    document.getElementById('detail-name').textContent = name;
    document.getElementById('detail-domain').textContent = tool.domain;
    document.getElementById('detail-desc').textContent = tool.description || '';
    document.getElementById('detail-screenshot').src = 'https://image.thum.io/get/width/1200/' + tool.url;
    document.getElementById('detail-screenshot').alt = name;
    document.getElementById('detail-favicon').src = 'https://www.google.com/s2/favicons?domain=' + tool.domain + '&sz=64';
    document.getElementById('detail-launch').href = tool.url;
    document.getElementById('detail-pricing').innerHTML = tool.pricing === 'Free' ? '<span class="badge badge-free">Free</span>' : '<span class="badge badge-freemium">Freemium</span>';
    document.getElementById('info-domain').textContent = tool.domain;
    document.getElementById('info-pricing').textContent = tool.pricing || 'Free';
    document.getElementById('info-category').textContent = (tool.tags || []).map(tTag).join(', ') || 'Uncategorized';
    document.getElementById('info-accessed').textContent = getTimesAccessed(tool.domain);

    const tagsHtml = (tool.tags || []).map(tag => '<a href="beacon.html?tag=' + tag + '" class="tag-pill">' + tTag(tag) + '</a>').join('');
    document.getElementById('detail-tags').innerHTML = tagsHtml;

    renderRating(tool.domain);
  }
}

})();
</script>
</body>
</html>
