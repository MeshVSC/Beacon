<style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #474747; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #cdf200; }
    @keyframes fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes nexus-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes nexus-pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    #nexus-loader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #131313; }
    #nexus-loader .ring { width: 80px; height: 80px; position: relative; animation: nexus-spin 3s linear infinite; }
    #nexus-loader .ring .dot { position: absolute; width: 8px; height: 8px; background: #cdf200; border-radius: 50%; }
    #nexus-loader .ring .dot:nth-child(1) { top: 0; left: 36px; animation: nexus-pulse 1.2s ease-in-out 0s infinite; }
    #nexus-loader .ring .dot:nth-child(2) { top: 10px; right: 4px; animation: nexus-pulse 1.2s ease-in-out 0.15s infinite; }
    #nexus-loader .ring .dot:nth-child(3) { bottom: 10px; right: 4px; animation: nexus-pulse 1.2s ease-in-out 0.3s infinite; }
    #nexus-loader .ring .dot:nth-child(4) { bottom: 0; left: 36px; animation: nexus-pulse 1.2s ease-in-out 0.45s infinite; }
    #nexus-loader .ring .dot:nth-child(5) { bottom: 10px; left: 4px; animation: nexus-pulse 1.2s ease-in-out 0.6s infinite; }
    #nexus-loader .ring .dot:nth-child(6) { top: 10px; left: 4px; animation: nexus-pulse 1.2s ease-in-out 0.75s infinite; }
    #nexus-loader .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #nexus-loader .label { margin-top: 24px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #474747; }
    .tool-card { background: #1c1b1b; border: 1px solid #474747; transition: all 0.3s; opacity: 0; animation: fade-up 0.4s ease-out forwards; cursor: pointer; overflow: hidden; }
    .tool-card:hover { border-color: #cdf200; transform: translateY(-2px); }
    .tool-card:hover .card-title { color: #cdf200; }
    .card-screenshot { width: 100%; aspect-ratio: 16/10; object-fit: cover; background: #0e0e0e; display: block; }
    .card-title { font-size: 14px; font-weight: 600; color: #e5e2e1; transition: color 0.2s; }
    .card-desc { font-size: 12px; color: #c5c9ac; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.5; }
    .card-tag { display: inline-block; font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 6px; border: 1px solid #474747; color: #c5c9ac; }
    .badge-free { border-color: #cdf200; color: #cdf200; }
    .badge-freemium { border-color: #474747; color: #c5c9ac; }
    .view-toggle a { font-family: 'Geist', sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 14px; border: 1px solid #474747; color: #c5c9ac; text-decoration: none; transition: all 0.2s; }
    .view-toggle a:hover { border-color: #cdf200; color: #cdf200; }
    .view-toggle a.active { background: #cdf200; color: #131313; border-color: #cdf200; }
    .btn-noir { background-color: #cdf200; color: #131313; transition: all 0.3s ease; }
    .btn-noir:hover { background-color: transparent; color: #cdf200; box-shadow: inset 0 0 0 1px #cdf200; }
</style>

<script>
(() => {

if (typeof FMHY_TOOLS !== 'undefined') TOOLS.push(...FMHY_TOOLS);
if (typeof TOOL_DESCRIPTIONS !== 'undefined') TOOLS.forEach(t => { if (TOOL_DESCRIPTIONS[t.domain]) t.description = TOOL_DESCRIPTIONS[t.domain]; });
TOOLS.forEach(t => {
  if (/nsfw/i.test(t.description) && !(t.tags || []).includes('nsfw')) {
    if (!t.tags) t.tags = [];
    t.tags.push('nsfw');
  }
});
try { const ct = JSON.parse(localStorage.getItem('beacon_custom_tools') || '[]'); ct.forEach(t => { if (!TOOLS.find(x => x.domain === t.domain)) TOOLS.push(t); }); } catch {}

let selectedTags = new Set(), currentSearch = '', currentPrice = 'All';
let filteredTools = [], currentPage = 1;
const PAGE_SIZE = 40;

const params = new URLSearchParams(window.location.search);
const rawTag = params.get('tag');
if (rawTag) rawTag.split(',').forEach(t => selectedTags.add(t.trim()));

const TAG_DISPLAY = {
  'ai':'AI','free-chat':'Free Chat','ai-api':'AI API','ai-coding':'AI Coding',
  'ai-image':'AI Image','ai-video':'AI Video','automation':'Automation',
  'streaming':'Streaming','live-tv':'Live TV','anime':'Anime','music':'Music',
  'radio':'Radio','gaming':'Gaming','game-tools':'Game Tools','books':'Books',
  'design':'Design','image-editing':'Image Editing','video-editing':'Video Editing',
  'fonts':'Fonts','icons':'Icons','3d':'3D','templates':'Templates',
  'ui-libraries':'UI Libraries','animation':'Animation','dev-tools':'Dev Tools',
  'hosting':'Hosting','web-building':'Web Building','education':'Education',
  'science':'Science','note-taking':'Note Taking','office':'Office',
  'browsers':'Browsers','search':'Search','social':'Social','privacy':'Privacy',
  'network':'Network','system':'System','files':'Files','downloads':'Downloads',
  'torrents':'Torrents','mobile':'Mobile','linux':'Linux','no-signup':'No Signup','nsfw':'NSFW'
};
function tTag(tag) { return TAG_DISPLAY[tag] || tag; }

const TAG_GROUPS = [
  { label: 'AI & Chat', tags: ['ai','free-chat','ai-coding','ai-image','ai-video','ai-api','no-signup','automation'] },
  { label: 'Media', tags: ['streaming','live-tv','anime','music','radio'] },
  { label: 'Gaming', tags: ['gaming','game-tools'] },
  { label: 'Design & Creative', tags: ['design','image-editing','video-editing','fonts','icons','3d','templates','ui-libraries','animation'] },
  { label: 'Development', tags: ['dev-tools','hosting','web-building'] },
  { label: 'Knowledge', tags: ['education','science','books','note-taking','office'] },
  { label: 'System & Privacy', tags: ['browsers','search','social','privacy','network','system','files','downloads','torrents','mobile','linux'] },
  { label: 'NSFW', tags: ['nsfw'] }
];

function toolName(domain) {
  try { const o = JSON.parse(localStorage.getItem('beacon_name_overrides') || '{}'); if (o[domain]) return o[domain]; } catch {}
  return (typeof TOOL_NAMES !== 'undefined' && TOOL_NAMES[domain]) ? TOOL_NAMES[domain] : domain;
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar-tags');
  const tagCounts = {};
  TOOLS.forEach(tool => { (tool.tags || []).forEach(tag => { tagCounts[tag] = (tagCounts[tag] || 0) + 1; }); });

  function tagLink(tag) {
    const active = selectedTags.has(tag);
    return '<a class="group flex items-center ' + (active ? 'text-primary' : 'text-on-surface-variant') + ' font-label-mono text-label-mono uppercase hover:text-primary transition-all cursor-pointer" data-tag="' + tag + '">' +
      (active ? '<span style="width:4px;height:4px;background:#cdf200;border-radius:50%;margin-right:8px;flex-shrink:0;"></span>' : '<span style="width:4px;height:4px;background:transparent;margin-right:8px;flex-shrink:0;"></span>') +
      tTag(tag) + ' <span style="font-size:9px;opacity:0.6;margin-left:4px;">' + (tagCounts[tag] || 0) + '</span></a>';
  }

  let html = '<a class="group flex items-center ' + (selectedTags.size === 0 ? 'text-primary' : 'text-on-surface-variant') + ' font-label-mono text-label-mono uppercase hover:text-primary transition-all cursor-pointer" id="btn-all-tags">' +
    (selectedTags.size === 0 ? '<span style="width:4px;height:4px;background:#cdf200;border-radius:50%;margin-right:8px;flex-shrink:0;"></span>' : '<span style="width:4px;height:4px;background:transparent;margin-right:8px;flex-shrink:0;"></span>') +
    'All Tags <span style="font-size:9px;opacity:0.6;margin-left:4px;">' + TOOLS.length + '</span></a>';

  TAG_GROUPS.forEach(group => {
    const groupTags = group.tags.filter(t => tagCounts[t]);
    if (!groupTags.length) return;
    html += '<div style="margin-top:16px;margin-bottom:6px;font-size:9px;letter-spacing:0.15em;color:#8f9378;text-transform:uppercase;">' + group.label + '</div>';
    groupTags.forEach(tag => { html += tagLink(tag); });
  });

  sidebar.innerHTML = html;
  document.getElementById('btn-all-tags').addEventListener('click', () => { selectedTags.clear(); renderSidebar(); render(); });
  sidebar.querySelectorAll('[data-tag]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (selectedTags.has(tag)) selectedTags.delete(tag); else selectedTags.add(tag);
      renderSidebar(); render();
    });
  });
}

function render() {
  let f = TOOLS.slice();
  try { const bl = JSON.parse(localStorage.getItem('beacon_blocklist') || '[]'); if (bl.length) f = f.filter(t => !bl.includes(t.domain)); } catch {}
  if (selectedTags.size > 0) f = f.filter(tool => { const tt = tool.tags || []; return [...selectedTags].some(st => tt.includes(st)); });
  if (currentPrice !== 'All') f = f.filter(t => t.pricing === currentPrice);
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    f = f.filter(t => t.domain.toLowerCase().includes(q) || t.description.toLowerCase().includes(q) || (t.tags || []).some(tag => tag.toLowerCase().includes(q)));
  }
  f.sort((a, b) => { const av = (a.domain || '').toLowerCase(); const bv = (b.domain || '').toLowerCase(); return av < bv ? -1 : av > bv ? 1 : 0; });

  const title = selectedTags.size === 0 ? 'Catalog' : [...selectedTags].map(tTag).join(', ');
  document.getElementById('section-title').textContent = title;
  document.getElementById('count-label').textContent = f.length + ' tools';
  document.getElementById('breadcrumb-count').textContent = 'All Apps (' + f.length + ')';

  const grid = document.getElementById('card-grid');
  const empty = document.getElementById('empty');
  if (!f.length) { grid.innerHTML = ''; empty.style.display = 'block'; filteredTools = []; document.getElementById('pagination').innerHTML = ''; return; }
  empty.style.display = 'none';
  filteredTools = f;
  currentPage = 1;
  renderPage(1);
}

function renderCard(tool, i) {
  const screenshot = 'https://image.thum.io/get/width/600/' + tool.url;
  const favicon = 'https://www.google.com/s2/favicons?domain=' + tool.domain + '&sz=32';
  const name = toolName(tool.domain);
  const desc = tool.description || '';
  const tags = (tool.tags || []).slice(0, 3).map(tg => '<span class="card-tag">' + tTag(tg) + '</span>').join(' ');
  const pricing = tool.pricing === 'Free' ? '<span class="card-tag badge-free">Free</span>' : '<span class="card-tag badge-freemium">Freemium</span>';
  return '<div class="tool-card" data-domain="' + tool.domain + '" data-url="' + tool.url + '" style="animation-delay:' + ((i % PAGE_SIZE) * 0.02) + 's;">' +
    '<img class="card-screenshot" src="' + screenshot + '" alt="' + name + '" loading="lazy" onerror="this.style.display=\'none\'">' +
    '<div class="p-4 space-y-3">' +
    '<div class="flex items-center gap-2"><img src="' + favicon + '" alt="" style="width:16px;height:16px;"><span class="card-title">' + name + '</span></div>' +
    '<p class="card-desc">' + desc + '</p>' +
    '<div class="flex flex-wrap gap-1">' + tags + ' ' + pricing + '</div>' +
    '</div></div>';
}

function renderPage(page) {
  currentPage = page;
  const grid = document.getElementById('card-grid');
  const start = (page - 1) * PAGE_SIZE;
  const batch = filteredTools.slice(start, start + PAGE_SIZE);
  grid.innerHTML = batch.map((tool, i) => renderCard(tool, start + i)).join('');

  grid.querySelectorAll('.tool-card').forEach(card => {
    card.addEventListener('click', () => {
      window.location.href = 'app-detail.html?domain=' + encodeURIComponent(card.dataset.domain);
    });
  });

  document.getElementById('result-count').textContent = 'Displaying ' + (start + 1) + '-' + Math.min(start + PAGE_SIZE, filteredTools.length) + ' of ' + filteredTools.length + ' Entries';
  renderPagination();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderPagination() {
  const container = document.getElementById('pagination');
  const totalPages = Math.ceil(filteredTools.length / PAGE_SIZE);
  if (totalPages <= 1) { container.innerHTML = ''; return; }

  const btnClass = 'bg-background px-4 py-2 font-label-mono text-label-mono uppercase transition-colors cursor-pointer';
  const activeClass = btnClass + ' text-primary-container border border-primary-container';
  const normalClass = btnClass + ' text-on-surface-variant hover:text-primary-container';
  const disabledClass = btnClass + ' text-on-surface-variant opacity-30 cursor-default';

  let html = '<button class="' + (currentPage === 1 ? disabledClass : normalClass + ' border border-transparent hover:border-primary-container') + '" data-page="prev">PREV</button>';
  let pages = [];
  if (totalPages <= 5) { for (let i = 1; i <= totalPages; i++) pages.push(i); }
  else {
    pages.push(1);
    if (currentPage > 3) pages.push('...');
    for (let i = Math.max(2, currentPage - 1); i <= Math.min(totalPages - 1, currentPage + 1); i++) pages.push(i);
    if (currentPage < totalPages - 2) pages.push('...');
    pages.push(totalPages);
  }
  pages.forEach(p => {
    if (p === '...') html += '<span class="' + btnClass + ' text-on-surface-variant">...</span>';
    else html += '<button class="' + (p === currentPage ? activeClass : normalClass) + '" data-page="' + p + '">' + String(p).padStart(2, '0') + '</button>';
  });
  html += '<button class="' + (currentPage === totalPages ? disabledClass : normalClass + ' border border-transparent hover:border-primary-container') + '" data-page="next">NEXT</button>';
  container.innerHTML = html;
  container.querySelectorAll('button[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.page;
      if (val === 'prev' && currentPage > 1) renderPage(currentPage - 1);
      else if (val === 'next' && currentPage < totalPages) renderPage(currentPage + 1);
      else if (val !== 'prev' && val !== 'next') renderPage(parseInt(val));
    });
  });
}

document.querySelectorAll('.price-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentPrice = btn.dataset.price;
    document.querySelectorAll('.price-btn').forEach(b => { b.classList.remove('active', 'text-primary'); b.classList.add('text-on-surface-variant'); });
    btn.classList.add('active', 'text-primary'); btn.classList.remove('text-on-surface-variant');
    render();
  });
});

document.getElementById('search').addEventListener('input', e => { currentSearch = e.target.value.trim(); var ms = document.getElementById('mobile-search'); if (ms) ms.value = e.target.value; render(); });
var mobileSearch = document.getElementById('mobile-search');
if (mobileSearch) mobileSearch.addEventListener('input', e => { currentSearch = e.target.value.trim(); document.getElementById('search').value = e.target.value; render(); });
const qParam = params.get('q');
if (qParam) { currentSearch = qParam; document.getElementById('search').value = qParam; if (mobileSearch) mobileSearch.value = qParam; }

renderSidebar();
render();
var loader = document.getElementById('nexus-loader');
if (loader) loader.style.display = 'none';

})();
</script>
