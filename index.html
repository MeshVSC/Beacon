<script>
        var FEATURED_DOMAINS = (function() { try { var s = localStorage.getItem('beacon_featured'); if (s) return JSON.parse(s); } catch(e) {} return ['lmarena.ai', 'chatjimmy.ai', 'aistudio.google.com', 'chat.z.ai', 'developer.puter.com']; })();

        var TAG_DISPLAY = {
          'ai':'AI','free-chat':'Free Chat','ai-api':'AI API','ai-coding':'AI Coding',
          'ai-image':'AI Image','ai-video':'AI Video','automation':'Automation',
          'streaming':'Streaming','live-tv':'Live TV','anime':'Anime','music':'Music',
          'radio':'Radio','gaming':'Gaming','game-tools':'Game Tools','books':'Books',
          'design':'Design','image-editing':'Image Editing','video-editing':'Video Editing',
          'fonts':'Fonts','icons':'Icons','3d':'3D','templates':'Templates',
          'ui-libraries':'UI Libraries','animation':'Animation','dev-tools':'Dev Tools',
          'hosting':'Hosting','web-building':'Web Building','education':'Education',
          'science':'Science','note-taking':'Note Taking','office':'Office',
          'browsers':'Browsers','search':'Search','social':'Social','privacy':'Privacy',
          'network':'Network','system':'System','files':'Files','downloads':'Downloads',
          'torrents':'Torrents','mobile':'Mobile','linux':'Linux','no-signup':'No Signup'
        };

        var BEACON_BLOCKLIST = (function() { try { var s = localStorage.getItem('beacon_blocklist'); if (s) return JSON.parse(s); } catch(e) {} return []; })();
        var BEACON_NAME_OVERRIDES = (function() { try { var s = localStorage.getItem('beacon_name_overrides'); if (s) return JSON.parse(s); } catch(e) {} return {}; })();

        function beaconToolName(domain) {
          if (BEACON_NAME_OVERRIDES[domain]) return BEACON_NAME_OVERRIDES[domain];
          return (typeof TOOL_NAMES !== 'undefined' && TOOL_NAMES[domain]) ? TOOL_NAMES[domain] : domain;
        }

        function renderHotChoices() {
          var allTools = (typeof TOOLS !== 'undefined' ? TOOLS : []).concat(typeof FMHY_TOOLS !== 'undefined' ? FMHY_TOOLS : []);
          var featured = [];
          FEATURED_DOMAINS.forEach(function(domain) {
            if (BEACON_BLOCKLIST.indexOf(domain) !== -1) return;
            for (var i = 0; i < allTools.length; i++) {
              if (allTools[i].domain === domain) { featured.push(allTools[i]); break; }
            }
          });
          document.getElementById('hotCount').textContent = featured.length + ' FEATURED TOOLS';
          var grid = document.getElementById('hotGrid');
          grid.innerHTML = featured.map(function(tool) {
            var tags = (tool.tags || []).map(function(t) {
              return '<span class="font-label-mono text-[10px] text-primary-container border border-primary-container/30 px-2 py-0.5">' + (TAG_DISPLAY[t] || t).toUpperCase() + '</span>';
            }).join('');
            var name = beaconToolName(tool.domain);
            var thumbUrl = 'https://image.thum.io/get/width/600/' + tool.url;
            return '<a href="' + tool.url + '" target="_blank" rel="noopener" class="card-hover bg-background/40 backdrop-blur-sm border border-secondary-container/50 p-6 flex flex-col group h-full no-underline">' +
              '<div class="aspect-video bg-surface-container-low mb-6 overflow-hidden relative">' +
              '<img class="w-full h-full object-cover card-img" src="' + thumbUrl + '" alt="' + tool.domain + '" loading="lazy"/>' +
              '</div>' +
              '<div class="flex gap-2 mb-4 flex-wrap">' + tags + '</div>' +
              '<h3 class="font-headline-md text-[20px] text-primary mb-3 drop-shadow-sm">' + name + '</h3>' +
              '<p class="font-body-md text-[14px] text-on-surface-variant mb-6 flex-grow">' + tool.description + '</p>' +
              '<div class="w-full mt-auto border border-secondary-container text-primary font-button text-button uppercase py-3 text-center hover:bg-primary-container hover:text-on-primary-container transition-all backdrop-blur-md bg-background/50">LAUNCH</div>' +
              '</a>';
          }).join('');
        }
        renderHotChoices();

        // Dynamic categories from localStorage
        (function() {
          var defaults = [
            {tag:'ai',label:'AI',subtitle:'Artificial Intelligence',visible:true},
            {tag:'free-chat',label:'FREE CHAT',subtitle:'Chat Interfaces',visible:true},
            {tag:'ai-coding',label:'AI CODING',subtitle:'Code Assistants',visible:true},
            {tag:'ai-image',label:'AI IMAGE',subtitle:'Image Generation',visible:true},
            {tag:'ai-video',label:'AI VIDEO',subtitle:'Video Generation',visible:true},
            {tag:'streaming',label:'STREAMING',subtitle:'Media Streams',visible:true},
            {tag:'gaming',label:'GAMING',subtitle:'Games & Platforms',visible:true},
            {tag:'design',label:'DESIGN',subtitle:'Design Tools',visible:true},
            {tag:'dev-tools',label:'DEV TOOLS',subtitle:'Developer Utilities',visible:true},
            {tag:'music',label:'MUSIC',subtitle:'Audio & Music',visible:true},
            {tag:'education',label:'EDUCATION',subtitle:'Learning Resources',visible:true},
            {tag:'privacy',label:'PRIVACY',subtitle:'Privacy Tools',visible:true}
          ];
          var cats = defaults;
          try { var s = localStorage.getItem('beacon_categories'); if (s) cats = JSON.parse(s); } catch(e) {}
          var grid = document.getElementById('catGrid');
          var allTools = (typeof TOOLS !== 'undefined' ? TOOLS : []).concat(typeof FMHY_TOOLS !== 'undefined' ? FMHY_TOOLS : []);
          grid.innerHTML = cats.filter(function(c) { return c.visible; }).map(function(c) {
            var count = allTools.filter(function(t) { return (t.tags || []).indexOf(c.tag) !== -1; }).length;
            return '<a href="beacon.html?tag=' + c.tag + '" class="group relative bg-surface-container-lowest/60 backdrop-blur-sm border border-secondary-container/30 no-underline overflow-hidden transition-all duration-300 hover:border-primary-container/80 hover:bg-surface-container-low/60" style="display:flex;flex-direction:column;justify-content:space-between;padding:20px 18px;min-height:120px;">' +
              '<div style="position:absolute;top:0;left:0;width:100%;height:2px;background:#cdf200;opacity:0;transition:opacity 0.3s;" class="group-hover:opacity-100"></div>' +
              '<div>' +
              '<div class="font-headline-md text-[16px] text-primary mb-1 tracking-tight">' + c.label + '</div>' +
              '<div class="font-label-mono text-[9px] text-on-surface-variant/60 uppercase tracking-widest">' + c.subtitle + '</div>' +
              '</div>' +
              '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;">' +
              '<span class="font-label-mono text-[10px] text-on-surface-variant/40 uppercase">' + count + ' tools</span>' +
              '<span class="font-label-mono text-[10px] text-primary-container/0 group-hover:text-primary-container uppercase transition-all duration-300" style="letter-spacing:0.1em;">Explore</span>' +
              '</div>' +
              '</a>';
          }).join('');
        })();

        // Copy overrides from localStorage
        (function() {
          try {
            var copy = JSON.parse(localStorage.getItem('beacon_copy') || 'null');
            if (!copy) return;
            if (copy.hero) {
              var words = copy.hero.split(' ');
              var mid = Math.ceil(words.length / 2);
              var el = document.getElementById('heroTitle');
              if (el) el.innerHTML = words.slice(0, mid).join(' ') + '<br/>' + words.slice(mid).join(' ');
            }
            if (copy.searchPlaceholder) { var s = document.getElementById('heroSearch'); if (s) s.placeholder = copy.searchPlaceholder; }
            if (copy.hotTitle) { var h = document.getElementById('hotTitle'); if (h) h.textContent = copy.hotTitle; }
            if (copy.catTitle) { var c = document.getElementById('catTitle'); if (c) c.textContent = copy.catTitle; }
          } catch(e) {}
        })();

        // Waving Tech Lines Animation
        const canvas = document.getElementById('wavingLines');
        const ctx = canvas.getContext('2d');
        let width, height, lines = [];

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            lines = [];
            for (let i = 0; i < 5; i++) {
                lines.push({
                    y: height * 0.5 + (i - 2) * 40,
                    amplitude: 20 + i * 15,
                    speed: 0.01 + i * 0.005,
                    offset: Math.random() * 10,
                    color: i % 2 === 0 ? '#cdf200' : '#ffffff'
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            lines.forEach(line => {
                ctx.beginPath();
                ctx.strokeStyle = line.color;
                ctx.lineWidth = 0.5;
                ctx.globalAlpha = 0.3;
                
                for (let x = 0; x < width; x++) {
                    const y = line.y + Math.sin(x * 0.002 + line.offset) * line.amplitude;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                
                ctx.stroke();
                line.offset += line.speed;
            });
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        init();
        draw();

        var heroSearch = document.getElementById('heroSearch');
        heroSearch.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                var q = this.value.trim();
                if (q) window.location.href = 'beacon.html?q=' + encodeURIComponent(q);
            }
        });
        document.addEventListener('keydown', function(e) {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                heroSearch.focus();
            }
        });

    </script>
